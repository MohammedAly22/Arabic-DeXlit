# ArabicDeXlit -- end-to-end rewriter, tuned for T4 / L4 (16-24GB).
#
# byt5-small rather than base: base does not train usefully at this memory
# budget, and a smaller model that finishes beats a larger one that does not.
#
#   python scripts/train.py --stage seq2seq --config configs/seq2seq_t4.yaml

model_name: google/byt5-small

data_dir: data/processed
output_dir: outputs/dexlit-s2s
max_train_examples: null
max_eval_examples: 2000

task_prefix: "restore code-switching: "

# Measured after the collision fix: source median 101 bytes, p99 167; target
# median 69, p99 123. Attention cost is quadratic in this, so the earlier 512
# budget was spending most of its compute on padding. Batches are additionally
# length-grouped, so a typical batch is shorter still.
max_source_length: 224
max_target_length: 192
dropout_rate: 0.1
label_smoothing: 0.1

num_beams: 4
length_penalty: 1.0
no_repeat_ngram_size: 0

# Batch together sentences of similar length. A batch costs as much as its
# longest member, so this alone cut padded compute 2.3x on this corpus.
group_by_length: true

epochs: 3
weight_decay: 0.01
warmup_ratio: 0.03
max_grad_norm: 1.0
seed: 42

log_every: 50
eval_every: 1000
eval_max_batches: 12
umr_penalty: 1.0

wandb_project: arabic-dexlit

# Memory is genuinely scarce here, so the checkpointing trade is worth taking.
gradient_checkpointing: true
batch_size: 16
eval_batch_size: 16
grad_accum: 16         # effective batch 256
learning_rate: 1.5e-4
num_workers: 4
prefetch_factor: 2
