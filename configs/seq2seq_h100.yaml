# ArabicDeXlit -- end-to-end rewriter, tuned for H100 / H200 (80-150GB).
#
# The default config left an H200 at ~13GB of 150GB and 0.78 steps/s. The causes
# were gradient checkpointing (unnecessary with this much VRAM), a batch of 8,
# padding to 512, and a dataloader that respawned its workers every epoch.
#
#   python scripts/train.py --stage seq2seq --config configs/seq2seq_h100.yaml

model_name: google/byt5-base

data_dir: data/processed
output_dir: outputs/dexlit-s2s
max_train_examples: null
max_eval_examples: 2000

task_prefix: "restore code-switching: "

# Measured after the collision fix: source median 101 bytes, p99 167; target
# median 69, p99 123. Attention cost is quadratic in this, so the earlier 512
# budget was spending most of its compute on padding. Batches are additionally
# length-grouped, so a typical batch is shorter still.
max_source_length: 224
max_target_length: 192
dropout_rate: 0.1
label_smoothing: 0.1

num_beams: 4
length_penalty: 1.0
no_repeat_ngram_size: 0

# Batch together sentences of similar length. A batch costs as much as its
# longest member, so this alone cut padded compute 2.3x on this corpus.
group_by_length: true

epochs: 3
weight_decay: 0.01
warmup_ratio: 0.03
max_grad_norm: 1.0
seed: 42

log_every: 50
eval_every: 1000
eval_max_batches: 12
umr_penalty: 1.0

wandb_project: arabic-dexlit

# With 80GB+ there is no reason to trade throughput for memory: checkpointing
# costs roughly 30-40% speed to save memory that is not scarce here.
# Measured on an H200 with scripts/diagnose_gpu.py:
#   checkpointing ON , batch 1725 -> 223 samples/s @ 111GB
#   checkpointing OFF, batch  162 -> 289 samples/s @ 121GB
# Off is 1.29x faster despite a 10x smaller batch, because recomputing the
# forward pass costs more than the memory it saves is worth on a 150GB card.
# 128 leaves headroom for length outliers the synthetic probe does not contain.
gradient_checkpointing: false
batch_size: 128
eval_batch_size: 128
grad_accum: 2          # effective batch 256
# Scaled for the larger batch: 1e-4 was tuned for an effective batch of 64.
learning_rate: 3.0e-4
num_workers: 16
prefetch_factor: 6
