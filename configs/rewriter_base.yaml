# ArabicDeXlit -- stage 2, dual-conditioned seq2seq variant.
#
# An alternative to the span-routing converter. The decoder rewrites the WHOLE
# sentence while attending to both the source text and the detector's tags, so
# it can resolve relationships between spans that span routing cannot see -- a
# three-word company name stays one name.
#
# Use instead of configs/converter_base.yaml, not alongside it.

data_dir: data/processed
output_dir: outputs/dexlit
max_train_examples: null
max_eval_examples: 20000

# --- vocabulary ---
# The corpus holds ~199K word types, so even 64K covers only 92.5% of tokens.
# But 90.8% of the tokens outside a 32K vocabulary appear verbatim in the
# source, so the copy mechanism recovers them. 32K + copy beats 64K without it.
vocab_size: 32000
vocab_min_count: 2

# --- architecture ---
d_model: 512
nhead: 8
num_encoder_layers: 6
num_decoder_layers: 6
dim_feedforward: 2048
dropout: 0.1
max_src_len: 48        # p95 is 26 tokens
max_tgt_len: 48

# 84% of output tokens are verbatim copies of input tokens. Without this the
# model must reconstruct them from the vocabulary, and every failure corrupts
# text nobody asked it to touch.
use_copy: true
# Tags are hidden this often during training so the decoder cannot treat the
# detector as infallible; a detector mistake then degrades output rather than
# dictating it.
tag_dropout: 0.1
label_smoothing: 0.1

# --- optimisation ---
epochs: 6
batch_size: 128
eval_batch_size: 128
learning_rate: 3.0e-4
weight_decay: 0.01
warmup_ratio: 0.05
max_grad_norm: 1.0
seed: 42
num_workers: 4

log_every: 50
eval_every: 500
eval_max_batches: 8
# Checkpoints are chosen on sentence-exact minus this times the Unnecessary
# Modification Rate, so a model that rewrites everything cannot win.
umr_penalty: 1.0

wandb_project: arabic-dexlit
run_name: rewriter
