# ArabicDeXlit -- stage 2 (character-level span converter).
#
# This stage is small and trains on short span pairs rather than sentences, so a
# full run is typically minutes. It is trained from scratch, hence the much
# higher learning rate than stage 1.

data_dir: data/processed
output_dir: outputs/detector   # saved alongside the detector for one-dir loading

# --- architecture ---
# ~5M parameters: big enough for phonetic mapping, small enough that inference
# over a few short spans is negligible next to the encoder pass.
# The first trained model (d=256, 3+3, ~9M params) plateaued at 33% exact match
# with near-miss errors ("meting", "frends") -- a capacity symptom, not a broken
# objective. This is ~53M: six times larger, still far smaller than a pretrained
# byte model, and it only ever runs on flagged spans.
d_model: 512
nhead: 8
num_encoder_layers: 6
num_decoder_layers: 6
dim_feedforward: 2048
dropout: 0.1
max_src_len: 96
max_tgt_len: 40

# Words of surrounding context on each side of the span. Without this the
# converter sees a span in isolation and cannot tell the Arabic article ال from
# a transliterated English word -- the observed failure was ال -> "la".
# Set to 0 for the old isolated-span behaviour.
context_window: 3

# --- hybrid word head ---
# Measured on this corpus: 1.25M spans reduce to ~15K unique English targets,
# the top 1,000 covering 93% of test spans. A closed-vocabulary head answers
# those exactly (a whole dictionary word -- misspelling is impossible) while the
# character decoder keeps the open vocabulary brand names and URLs need.
use_word_head: true
lexicon_max_size: 20000
# Targets seen once are usually typos or one-off entities; the character decoder
# handles those better than a softmax slot trained on a single example.
lexicon_min_count: 2
word_loss_weight: 1.0
# Below this probability the word head abstains and the characters decide.
# Raise it to be more conservative (more falls through to characters).
word_confidence: 0.90

# --- optimisation ---
epochs: 15
batch_size: 192
eval_batch_size: 192
learning_rate: 3.0e-4
weight_decay: 0.01
warmup_ratio: 0.05
max_grad_norm: 1.0
seed: 42
num_workers: 2

log_every: 100
eval_every: 500
eval_max_batches: 20

wandb_project: arabic-dexlit
run_name: converter
